<div class="admin-page">
  <div class="admin-page__header">
    <h2 class="admin-page__title">Gestión de Productos</h2>
    <a routerLink="/admin/products/new" class="btn btn--primary">
      <span>➕</span> Nuevo Producto
    </a>
  </div>

  <div *ngIf="(state$ | async) as state" class="admin-page__content">
    <div *ngIf="state.loading" class="loading-spinner">
      <div class="spinner"></div>
      <p>Cargando productos...</p>
    </div>

    <div *ngIf="!state.loading" class="card">
      <app-admin-product-table [products]="state.products"></app-admin-product-table>
    </div>
  </div>
</div>
