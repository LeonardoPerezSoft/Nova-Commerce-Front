<div class="nc-home">
  <!-- Hero Carousel Section -->
  <div class="nc-home__hero nc-home__hero-carousel">
    <div class="nc-carousel">
      <!-- Botón Anterior -->
      <button class="nc-carousel__nav nc-carousel__nav--prev" (click)="prevSlide()" aria-label="Anterior">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="nc-carousel__track" [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">
        <div
          class="nc-carousel__slide"
          *ngFor="let slide of carouselSlides; let i = index"
          [routerLink]="slide.buttonLink || null"
          [class.clickable]="!!slide.buttonLink"
          [attr.tabindex]="slide.buttonLink ? 0 : -1"
          role="link"
          aria-label="{{ slide.title }}"
        >
          <div class="nc-carousel__content">
            <h2>{{ slide.title }}</h2>
            <p>{{ slide.description }}</p>
          </div>
        </div>
      </div>

      <!-- Botón Siguiente -->
      <button class="nc-carousel__nav nc-carousel__nav--next" (click)="nextSlide()" aria-label="Siguiente">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <div class="nc-carousel__indicators">
        <span
          *ngFor="let slide of carouselSlides; let i = index"
          class="nc-carousel__indicator"
          [class.active]="currentSlide === i"
          (click)="goToSlide(i)">
        </span>
      </div>
    </div>
  </div>

  <!-- Estado de Carga -->
  <div *ngIf="loading" class="nc-home__loading">
    <div class="spinner"></div>
    <p>Cargando productos...</p>
  </div>

  <!-- Estado de Error -->
  <div *ngIf="error && !loading" class="nc-home__error">
    <p>{{ error }}</p>
  </div>

  <!-- Grilla de Productos -->
  <div *ngIf="!loading && !error" class="nc-home__products">
    <h2>Productos Destacados</h2>
    <div class="nc-home__grid">
      <div *ngFor="let product of products" class="nc-product-card">
        <!-- Imagen del Producto -->
          <div class="nc-product-card__image">
          <img
            [src]="product.imageUrl || 'assets/placeholder-product.svg'"
            [alt]="product.name"
            (error)="onImageError($event)">
          <span class="nc-product-card__badge nc-product-card__type" [ngClass]="'badge--' + (product.productType?.toLowerCase() || 'physical')">
            {{ product.productType || 'PHYSICAL' }}
          </span>
        </div>

        <div class="nc-product-card__body">
          <h3 class="nc-product-card__title">{{ product.name }}</h3>
          <p class="nc-product-card__description">{{ product.description }}</p>

          <div class="nc-product-card__footer">
            <div class="nc-product-card__price">
              <span class="currency">$</span>
              <span class="amount">{{ product.price | number: '1.2-2' }}</span>
            </div>
            <button class="nc-product-card__button" [routerLink]="['/products']">
              Ver Detalles
            </button>
          </div>
      </div>
    </div>
  </div>

  <!-- Sin Productos -->
  <div *ngIf="!loading && !error && products.length === 0" class="nc-home__empty">
    <p>No hay productos disponibles en este momento.</p>
  </div>
</div>
