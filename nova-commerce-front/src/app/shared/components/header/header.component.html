<header class="nc-header">
  <div class="nc-header__container">
    <!-- Logo -->
    <div class="nc-header__logo">
      <a routerLink="/" class="nc-header__logo-link">
        <img src="/logo.svg" alt="NovaCommerce" class="nc-header__logo-img" />
        <span class="nc-header__brand">NovaCommerce</span>
      </a>
    </div>

    <!-- Navegación principal -->
    <nav class="nc-header__nav">
      <ul class="nc-header__nav-list">
        <li class="nc-header__nav-item">
          <a routerLink="/products" routerLinkActive="nc-header__nav-link--active" class="nc-header__nav-link">
            Productos
          </a>
        </li>
        <li class="nc-header__nav-item">
          <a routerLink="/orders" routerLinkActive="nc-header__nav-link--active" class="nc-header__nav-link">
            Mis Órdenes
          </a>
        </li>
        <li class="nc-header__nav-item" *ngIf="userFacade.isAdmin$|async">
          <a routerLink="/admin" routerLinkActive="nc-header__nav-link--active" class="nc-header__nav-link">
            Admin
          </a>
        </li>
      </ul>
    </nav>

    <!-- Área de usuario -->
    <div class="nc-header__actions">
      <!-- Mostrar cuando NO está autenticado -->
      <a *ngIf="!(userFacade.isAuthenticated$|async)"
         routerLink="/auth/login"
         class="nc-header__login-btn">
        Iniciar Sesión
      </a>

      <!-- Mostrar cuando SÍ está autenticado -->
      <div *ngIf="userFacade.isAuthenticated$|async" class="nc-header__user">
        <span class="nc-header__username">{{ userFacade.email$ | async }}</span>
        <button class="nc-header__logout-btn" type="button" (click)="onLogout()">
          Cerrar Sesión
        </button>
      </div>
    </div>
  </div>
</header>
